{% extends 'DeskHelp/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<h1>login</h1>
<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
</form>
<a href="{% url 'password_reset' %}">Forgot password?</a>
<a href="{% url 'password_change' %}">Change password</a>

{% endblock %}
