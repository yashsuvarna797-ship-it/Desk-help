{% extends 'DeskHelp/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="form-content">
    <div class="form">
        <h1>Login</h1>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create</button>
        </form>
        <a href="{% url 'password_reset' %}">Forgot password?</a>
    </div>
</div>

{% endblock %}
