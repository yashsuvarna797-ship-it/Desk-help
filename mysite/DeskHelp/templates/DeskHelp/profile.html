{% extends 'DeskHelp/base.html' %}
{% block title %}Profile{% endblock %}
{% block content %}
{% load static %}


<div class="display-content">
    <div class="user-profile-pic">
        
        <form method="POST" class="profile-form" enctype="multipart/form-data">
            {% csrf_token %}
            <img src="{{ request.user.profile.profile_pic.url }}" 
            class="user-profile" alt="Profile Picture">

            <input
            type="file"
            name="profile_pic"
            id="id_profile_pic"
            accept="image/*"
            >
            <label for="id_profile_pic" class="edit-image">
                <img class="edit" src="{% static 'DeskHelp/assets/edit.png' %}">
            </label>    
            
            <div class="user-details">
                {{ user.username }}
            </div>

            <textarea
                class="bio"
                name="bio"
                id="id_bio"
                rows="5"
                placeholder="Write something about yourself..."
            >{{ form.bio.value|default_if_none:"" }}</textarea>

            <button type="submit">Update Profile</button>
        </form>
        <!-- <a href="{% url 'profile' %}">
            <img src="{% static 'DeskHelp/assets/edit.png' %}" 
            class="edit">
        </a> -->
    </div>    
</div>

{% endblock %}
