
{% extends 'DeskHelp/base.html' %}
{% load static %}
{% block title %}Home{% endblock %}



{% block content %}
    <div class="content">
        {% if user.is_authenticated %}
        <div class="left-sidebar">
            {% if ticket_list %}
                <p>Your Tickets</p>
                {% for ticket in ticket_list %}
                    <div class="ticket-element">
                        <a href="{% url 'display_ticket_info' ticket.id %}">{{ ticket.title }}</a>
                    </div>
                {% endfor %}
            {% endif %}
        </div>
        {% endif %}
        <div class="ticket">
            <img class="create-ticket" src="{% static 'DeskHelp/assets/ticket.png' %}">
        </div>
    </div>

    

{% endblock %}
