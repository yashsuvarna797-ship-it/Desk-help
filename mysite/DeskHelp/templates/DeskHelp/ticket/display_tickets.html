{% extends 'DeskHelp/base.html' %}
{% block title %}Create Ticket{% endblock %}
{% block content %}

<h1>Display Tickets</h1>

<form method="GET">
    <select name="status">
        <option value="">All statuses</option>
        <option value="OPEN">open</option>
        <option value="IN_PROGRESS">in progress</option>
        <option value="RESOLVED">resolved</option>
        <option value="CLOSED">closed</option>
    </select>
    <select name="time">
        <option value="">All</option>
        <option value="latest">latest</option>
        <option value="oldest">oldest</option>
    </select>
    <button type="submit">filter</button>
</form>

{% if ticket_list %}
    {% for ticket in ticket_list %}
    <ul>
        <li><a href="{% url 'display_ticket_info' ticket.id %}">{{ ticket.title }}</a></li>
    </ul>
    {% endfor %}

{% else %}
    <p>No tickets found create -> <a href="{% url 'create_ticket' %}">here</a></p>
{% endif %}
{% endblock %}
